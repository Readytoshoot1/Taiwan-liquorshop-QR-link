<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
<title>위스키 정보 모음</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="site-header">
  <h1>위스키 정보 모음</h1>
  <p class="subtitle">주류상점 · 여행지 · 할인 정보를 한곳에</p>
</header>

<nav class="main-tabs" id="mainTabs">
  <button class="main-tab active" data-target="qr">주류상점 QR</button>
  <button class="main-tab" data-target="travel">여행 정보</button>
  <button class="main-tab" data-target="unionpay">유니온페이 할인</button>
  <button class="main-tab" data-target="taxcalc">세금 계산기</button>
  <button class="main-tab" data-target="whisky">위스키 가격표</button>
</nav>

<section class="panel" id="qr">
  <div class="search-wrap">
    <label class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="7" />
        <path d="m20 20-3.5-3.5" />
      </svg>
      <input type="search" id="searchInput" class="search-input" placeholder="가게 이름 또는 지역 검색" autocomplete="off" />
    </label>
  </div>

  <nav class="tabs" id="tabs"></nav>

  <main class="grid" id="grid"></main>

  <p class="empty" id="empty" hidden>해당 지역에 등록된 QR코드가 없습니다.</p>
</section>

<section class="panel" id="travel" hidden>
  <nav class="tabs" id="travelCategoryTabs">
    <button class="tab-btn active" data-category="전체">전체</button>
    <button class="tab-btn" data-category="호텔">호텔</button>
    <button class="tab-btn" data-category="음식점">음식점</button>
  </nav>

  <div class="travel-toolbar">
    <input type="search" id="travelSearch" class="search-input" placeholder="이름, 분류, 비고, 공유자 검색" autocomplete="off" />
    <div class="travel-options">
      <select id="travelSort" class="select-input">
        <option value="recent">최신순</option>
        <option value="oldest">오래된순</option>
        <option value="name">이름순</option>
      </select>
      <label class="check-label">
        <input type="checkbox" id="travelReviewOnly" />
        검토 필요만
      </label>
    </div>
  </div>

  <p class="travel-count" id="travelCount"></p>
  <ul class="travel-list" id="travelList"></ul>
  <p class="empty" id="travelEmpty" hidden>조건에 맞는 장소가 없습니다.</p>
</section>

<section class="panel" id="unionpay" hidden>
  <div class="up-head">
    <p>유니온페이 할인 정보</p>
    <a class="up-open" href="https://marketing.unionpayintl.com/offer-promote/?language=kr&insCode=299990156&countryCode=410#/" target="_blank" rel="noopener noreferrer">새 창에서 열기</a>
  </div>
  <iframe
    class="up-frame"
    src="https://marketing.unionpayintl.com/offer-promote/?language=kr&insCode=299990156&countryCode=410#/"
    title="유니온페이 할인 정보"
    loading="lazy"
  ></iframe>
</section>

<section class="panel" id="taxcalc" hidden>
  <div class="tc-intro">
    <p>해외(영국/유럽 등)에서 위스키를 구매해 대만·일본·한국으로 DHL 발송할 때 드는 세금 + DHL 수수료를 계산합니다.</p>
    <p class="tc-rate-info" id="tcRateInfo">환율 불러오는 중...</p>
  </div>

  <div class="tc-card">
    <div class="tc-row">
      <label class="tc-field">
        <span>구매 통화</span>
        <select id="tcCurrency" class="select-input">
          <option value="USD">USD ($)</option>
          <option value="GBP">GBP (£)</option>
          <option value="EUR">EUR (€)</option>
        </select>
      </label>
      <label class="tc-field">
        <span>DHL 국제 배송비</span>
        <input type="number" id="tcShipping" class="select-input" min="0" step="0.01" value="50" />
      </label>
    </div>
    <details class="tc-rate-edit">
      <summary>환율 직접 수정</summary>
      <div class="tc-rate-grid" id="tcRateGrid"></div>
    </details>
  </div>

  <div class="tc-card">
    <div class="tc-cart-head">
      <h3>위스키 목록</h3>
      <button type="button" class="tc-add-btn" id="tcAddBottle">+ 위스키 추가</button>
    </div>
    <div id="tcBottleList" class="tc-bottle-list"></div>
  </div>

  <p class="tc-summary" id="tcCartSummary"></p>

  <div class="tc-results" id="tcResults"></div>
</section>

<section class="panel" id="whisky" hidden>
  <div class="up-head">
    <p>대만 주류상점 22곳 · 위스키 5,997병 가격·WB점수 조회</p>
    <a class="up-open" href="whisky/index.html" target="_blank" rel="noopener noreferrer">새 창에서 열기</a>
  </div>
  <iframe
    class="up-frame whisky-frame"
    src="whisky/index.html"
    title="대만 위스키 가격표"
    loading="lazy"
  ></iframe>
</section>

<div class="modal" id="modal" hidden>
  <button class="modal-close" id="modalClose" aria-label="닫기">&times;</button>
  <figure class="modal-content">
    <img id="modalImg" src="" alt="" />
    <figcaption id="modalCaption"></figcaption>
    <p id="modalNote" class="modal-note" hidden></p>
    <div id="modalLinks" class="modal-links"></div>
  </figure>
</div>

<script src="script.js"></script>
<script src="travel.js"></script>
<script src="tax-calculator.js"></script>
<script data-goatcounter="https://abc12341.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
